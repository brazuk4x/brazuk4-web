<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Pública Independiente</title>
    <!-- Tailwind CSS CDN for error/loading states -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #previewFrame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            background-color: #ffffff;
            z-index: 10;
        }
    </style>
</head>
<body class="h-full w-full bg-black text-gray-100 font-sans">

    <!-- Loading Screen (fades out as soon as site is ready) -->
    <div id="viewerLoading" class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-[#080C14] transition-opacity duration-300">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 mb-3 animate-spin">
            <i class="fa-solid fa-spinner text-lg"></i>
        </div>
        <p class="text-xs font-mono text-gray-400">Cargando sitio web independiente...</p>
    </div>

    <!-- Error State (if project not found) -->
    <div id="viewerError" class="hidden fixed inset-0 z-40 flex flex-col items-center justify-center bg-[#080C14] p-6 text-center">
        <div class="w-14 h-14 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 mb-4 text-xl">
            <i class="fa-solid fa-globe"></i>
        </div>
        <h2 class="text-lg font-bold text-white mb-2">Página Web no encontrada</h2>
        <p class="text-gray-400 text-xs max-w-sm mb-6">
            Esta ruta no contiene archivos publicados o el proyecto no existe en este servidor.
        </p>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs transition">
            Ir al inicio
        </a>
    </div>

    <!-- 100% Full Screen Standalone Website Viewport -->
    <iframe 
        id="previewFrame" 
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals"
        title="Web Pública"
    ></iframe>

    <!-- Viewer Script -->
    <script>
        const DB_NAME = 'brazuk4_web_loader_db';
        const DB_VERSION = 1;
        const STORE_NAME = 'projects';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function getProjectById(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getAllProjects() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        let siteId = urlParams.get('id');
        let siteSlug = urlParams.get('p') || urlParams.get('slug');

        // Also check pathname (for /p/slug/part1/part2)
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        if (!siteSlug && pathParts.length > 1 && pathParts[0] === 'p') {
            siteSlug = pathParts[1];
        }

        const previewFrame = document.getElementById('previewFrame');
        const viewerLoading = document.getElementById('viewerLoading');
        const viewerError = document.getElementById('viewerError');

        function renderProject(project) {
            document.title = project.name || 'Mi Página Web';

            const fileMap = {};
            const mimeTypes = {
                'css': 'text/css',
                'js': 'application/javascript',
                'json': 'application/json',
                'png': 'image/png',
                'jpg': 'image/jpeg',
                'jpeg': 'image/jpeg',
                'svg': 'image/svg+xml',
                'gif': 'image/gif',
                'webp': 'image/webp',
                'ico': 'image/x-icon',
                'html': 'text/html'
            };

            // First pass: generate Blob URLs for all assets
            project.files.forEach(file => {
                const normPath = file.path.replace(/^\/+/, '');
                const ext = normPath.split('.').pop().toLowerCase();
                const mime = mimeTypes[ext] || file.type || 'text/plain';

                let blob;
                if (file.isBase64) {
                    const byteChars = atob(file.content);
                    const byteNumbers = new Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) {
                        byteNumbers[i] = byteChars.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    blob = new Blob([byteArray], { type: mime });
                } else {
                    blob = new Blob([file.content], { type: mime });
                }
                const blobUrl = URL.createObjectURL(blob);
                fileMap[normPath] = blobUrl;
                fileMap['./' + normPath] = blobUrl;
                fileMap['/' + normPath] = blobUrl;
            });

            // Find entry file
            let entryFile = project.files.find(f => {
                const p = f.path.replace(/^\/+/, '').toLowerCase();
                return p === 'index.html' || p.endsWith('/index.html');
            }) || project.files.find(f => f.path.endsWith('.html'));

            if (!entryFile) {
                entryFile = {
                    path: 'index.html',
                    content: `<!DOCTYPE html><html><head><title>${project.name}</title><style>body{font-family:sans-serif;padding:2rem;text-align:center;background:#0f172a;color:#f8fafc;}</style></head><body><h1>${project.name}</h1><p>Sitio web activo y publicado.</p></body></html>`
                };
            }

            let htmlContent = entryFile.content;

            // Replace relative URLs with Blob URLs
            Object.keys(fileMap).forEach(filePath => {
                const blobUrl = fileMap[filePath];
                const escaped = filePath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const srcRegex = new RegExp(`(src=["'])${escaped}(["'])`, 'gi');
                const hrefRegex = new RegExp(`(href=["'])${escaped}(["'])`, 'gi');
                htmlContent = htmlContent.replace(srcRegex, `$1${blobUrl}$2`);
                htmlContent = htmlContent.replace(hrefRegex, `$1${blobUrl}$2`);
            });

            const htmlBlob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const htmlBlobUrl = URL.createObjectURL(htmlBlob);
            previewFrame.src = htmlBlobUrl;

            previewFrame.onload = () => {
                viewerLoading.style.opacity = '0';
                setTimeout(() => viewerLoading.classList.add('hidden'), 300);
            };
        }

        async function initViewer() {
            try {
                let project = null;

                if (siteId) {
                    project = await getProjectById(siteId);
                }

                if (!project && siteSlug) {
                    const all = await getAllProjects();
                    project = all.find(p => p.slug === siteSlug || (p.randomPath && p.randomPath.includes(siteSlug)));
                }

                if (!project) {
                    const all = await getAllProjects();
                    if (all.length > 0) {
                        project = all[all.length - 1];
                    }
                }

                if (project) {
                    renderProject(project);
                } else {
                    viewerLoading.classList.add('hidden');
                    viewerError.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Error loading project in viewer:", err);
                viewerLoading.classList.add('hidden');
                viewerError.classList.remove('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', initViewer);
    </script>
</body>
</html>
